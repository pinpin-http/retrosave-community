# Limite le daemon Gradle à 2 Go : assez pour ce module unique sans affamer Docker.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Accélère les builds suivants sans changer leur résultat.
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Toutes les dépendances Android du POC utilisent AndroidX.
android.useAndroidX=true

# Garde un format Kotlin stable entre Android Studio et la CI.
kotlin.code.style=official
